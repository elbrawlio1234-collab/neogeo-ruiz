<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neo Bomberman - Neo Geo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        EJS_player = '#game';
        EJS_core = 'fbneo';
        EJS_gameName = 'Neo Bomberman';
        EJS_gameUrl = 'https://elbrawlio1234-collab.github.io/neogeo-ruiz/neobombe.zip';
        EJS_biosUrl = 'https://elbrawlio1234-collab.github.io/neogeo-ruiz/neogeo.zip';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_language = 'es-ES';
        EJS_startOnLoaded = true;
        
        // Configuraciones avanzadas para máxima fluidez
        EJS_threads = true; // Activa multiprocesamiento en el navegador
        EJS_defaultOptions = {
            useTouch: true,
            shader: 'disabled', // Apaga efectos visuales pesados que quitan FPS
            ratio: 'auto',
            'fbneo-cpu-speed-adjust': '100%'
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
