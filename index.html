<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evita el zoom accidental al tocar rápido los botones y adapta al ancho del celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neo Bomberman - Neo Geo</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none; /* Evita menú de copiar/guardar en iOS al dejar presionado */
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* Se adapta a la altura real sin que lo tape la barra del navegador móvil */
            background-color: #000;
            overflow: hidden;
            touch-action: none; /* Bloquea el deslizamiento (scroll) o zoom con dos dedos */
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        EJS_player = '#game';
        EJS_core = 'fbneo';
        EJS_gameName = 'Neo Bomberman';
        EJS_gameUrl = 'https://elbrawlio1234-collab.github.io/neogeo-ruiz/neobombe.zip';
        EJS_biosUrl = 'https://elbrawlio1234-collab.github.io/neogeo-ruiz/neogeo.zip';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_language = 'es-ES'; // Menú del emulador en español
        EJS_startOnLoaded = true;
        EJS_VirtualGamepadSettings = [
            { type: 'zone', location: 'left', left: '10%', bottom: '15%', joystickInput: true, color: 'rgba(255, 255, 255, 0.35)' },
            { type: 'button', text: 'A', id: 'a', location: 'right', right: '18%', bottom: '12%', bold: true, input_value: 8 },
            { type: 'button', text: 'B', id: 'b', location: 'right', right: '6%', bottom: '22%', bold: true, input_value: 0 },
            { type: 'button', text: 'COIN', id: 'select', location: 'top', left: '35%', top: '15px', fontSize: '12px', input_value: 2 },
            { type: 'button', text: 'START', id: 'start', location: 'top', right: '35%', top: '15px', fontSize: '12px', input_value: 3 }
        ];
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
